    <script>
    /* 
    1. Sum of Array (no reduce)
    Input: [1,2,3,4] → Output: 10
    */

     sumArr([1,2,3,4]);
      function sumArr(num){
        let sum = 0;
        for(let i=0; i<num.length; i++){
         sum += num[i];
        }
        alert(sum);
      }
    </script>
